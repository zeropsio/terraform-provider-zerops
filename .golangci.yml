version: "2"

linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    staticcheck:
      # Defaults plus stylistic checks this codebase intentionally does not follow
      # (capitalized "Zerops ..." error strings, explicit boolean/selector forms).
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1013
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1008
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
